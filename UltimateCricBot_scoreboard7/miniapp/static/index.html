<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricket League</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#070718;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--txt:#f4f4fb;--mut:#9a9ab8;--acc:#ff9d42;--acc2:#4ade80;--gold:#f5c04a;--silver:#c9cde8;--bronze:#e0976a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 0;min-height:100vh;background:radial-gradient(900px 420px at 10% -10%,var(--hue1,#7c3aed55),transparent),radial-gradient(700px 400px at 110% 10%,var(--hue2,#22d3ee33),transparent),var(--bg);transition:background .4s}
body[data-tab=ranks]{--hue1:#f59e0b66;--hue2:#be123c33}
body[data-tab=tours]{--hue1:#6366f166;--hue2:#a855f733}
body[data-tab=trophies]{--hue1:#10b98166;--hue2:#0ea5e933}
body[data-tab=zone]{--hue1:#fb923c77;--hue2:#22c55e44}
#app{padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff9d42,#ef4444);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 18px #0006}
.brand b{letter-spacing:.28em;font-size:15px}.brand small{display:block;color:var(--acc);letter-spacing:.05em;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px;backdrop-filter:blur(10px)}
.center{text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:800;font-size:34px;color:#fff;border:3px solid #7dd3fc;margin:6px auto 10px;box-shadow:0 0 28px #7dd3fc44}
.name{font-size:30px;font-weight:800;background:linear-gradient(90deg,#c4b5fd,#a5f3fc);-webkit-background-clip:text;color:transparent}
.sub{color:var(--mut);margin-top:2px}
.rankbox{display:flex;gap:14px;align-items:center;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:22px;background:#0003;text-align:left}
.hex{min-width:118px;padding:14px 6px;text-align:center;border:3px solid #38bdf8;border-radius:18px;background:#0b0a2e}
.hex small{letter-spacing:.2em;font-size:11px;color:#bae6fd}.hex div{font-size:34px;font-weight:900}
.tier{font-size:24px;font-weight:800;color:#7dd3fc}.bar{height:8px;border-radius:6px;background:#fff2;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#7dd3fc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.stat small{color:var(--mut);display:block}.stat b{font-size:22px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:700;color:#10131a;background:linear-gradient(90deg,#ff9d42,#fde7c7 50%,#4ade80);margin-top:14px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
h2{font-size:26px;margin:4px 0 12px}h3{font-size:19px;margin:18px 0 10px;border-left:4px solid #2dd4bf;padding-left:10px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:15px}
.pill.on{background:linear-gradient(90deg,#ff9d42,#f472b6);color:#1a1020;font-weight:700;border-color:transparent}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:8px 0 16px;text-align:center}
.pod .av{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;border:3px solid var(--c);color:#fff}
.pod.p1 .av{width:82px;height:82px;font-size:24px}.pod .blk{border:1px solid var(--line);border-radius:18px 18px 0 0;background:linear-gradient(#ffffff14,#0000);padding:10px 4px;margin-top:6px;border-top:3px solid var(--c)}
.pod.p1{--c:var(--gold)}.pod.p2{--c:var(--silver)}.pod.p3{--c:var(--bronze)}.pod .blk b{font-size:20px;color:var(--c)}.pod .blk i{display:block;font-style:normal;font-size:30px;font-weight:900;opacity:.35}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;margin-bottom:6px;background:var(--card);border:1px solid var(--line)}
.row.me{border-color:#7dd3fc;background:#38bdf822}.row .n{width:34px;text-align:center;color:var(--mut);font-weight:700}.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t small{color:var(--mut)}.row .v{font-weight:800}
.mini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex:none}
.empty{text-align:center;color:var(--mut);padding:60px 10px}.empty .ic{font-size:46px;opacity:.6}.empty b{display:block;color:var(--txt);font-size:20px;margin:8px 0 4px}
.tcard{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff2}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tro{border:1px solid var(--line);border-radius:20px;padding:12px 6px;text-align:center;background:var(--card)}
.tro .m{width:62px;height:62px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:24px;font-weight:900;color:#2b1a10;background:var(--mc);box-shadow:inset 0 -4px 10px #0003}
.tro.lock .m{background:#374151;color:#9ca3af;filter:grayscale(1)}.tro small{display:block;color:var(--mut);font-size:11px;margin-top:2px}.tro b{font-size:13px}
.bronze{--mc:linear-gradient(135deg,#f3b58d,#c57a4b)}.silver{--mc:linear-gradient(135deg,#f1f3ff,#9aa3c7)}.gold{--mc:linear-gradient(135deg,#ffe08a,#e0a82e)}
.summ{display:flex;gap:16px;align-items:center}.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:conic-gradient(var(--acc) calc(var(--p)*1%),#fff2 0)}.ring span{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#0b1620}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;padding:8px;border-radius:30px;background:rgba(24,22,66,.92);border:1px solid var(--line);backdrop-filter:blur(14px);z-index:10}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;border-radius:22px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button span{font-size:22px}.nav button.on{background:#ffffff1c;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-weight:600;text-align:right;padding:6px 3px}td{padding:8px 3px;text-align:right;border-top:1px solid var(--line)}th:nth-child(2),td:nth-child(2){text-align:left}.scroll{overflow-x:auto}
.fx{padding:10px 0;border-top:1px solid var(--line);font-size:14px}.fx small{color:var(--mut);display:block}
.spin{margin:80px auto;width:36px;height:36px;border:4px solid #fff3;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body data-tab="profile">
<div id="app"><div class="spin"></div></div>
<nav class="nav" id="nav"></nav>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{tg.setHeaderColor('#070718');tg.setBackgroundColor('#070718');}catch(e){} }
const TABS=[["profile","👤","Profile"],["ranks","🏆","Ranks"],["tours","🚩","Tours"],["trophies","🏅","Trophies"],["zone","🌐","Zone"]];
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("en-IN");
const state={tab:"profile",metric:"overall",group:"live",q:"",cat:"All",tour:null};
const COLORS=["#f97316","#8b5cf6","#06b6d4","#ec4899","#22c55e","#eab308","#ef4444","#3b82f6"];
const ini=n=>(String(n).trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2)||"?").toUpperCase();
const col=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const av=(n,id,cls="mini")=>`<div class="${cls}" style="background:${col(id??n)}">${esc(ini(n))}</div>`;
const when=t=>t?new Date(t*1000).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+" IST":"time TBD";
const haptic=()=>{try{tg.HapticFeedback.selectionChanged()}catch(e){}};

async function api(path){
  const r=await fetch(path,{headers:{Authorization:"tma "+(tg?tg.initData:"")}});
  if(r.status===401) throw new Error("open");
  if(!r.ok) throw new Error("fail");
  return r.json();
}
const brand=sub=>`<div class="brand"><div class="logo">🏏</div><div><b>CRICKET LEAGUE</b><small>● ${sub||"MiniApp"}</small></div></div>`;
const empty=(ic,t,s)=>`<div class="empty"><div class="ic">${ic}</div><b>${t}</b>${s||""}</div>`;

function nav(){ $("#nav").innerHTML=TABS.map(([k,i,l])=>`<button class="${state.tab===k?"on":""}" data-t="${k}"><span>${i}</span>${l}</button>`).join("");
  document.body.dataset.tab=state.tab;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;state.tour=null;haptic();render();window.scrollTo(0,0)}); }

async function render(){
  nav(); app.innerHTML='<div class="spin"></div>';
  try{ await VIEWS[state.tab](); }
  catch(e){ app.innerHTML=brand()+(e.message==="open"?empty("📱","Open from Telegram","This app works inside the bot's chat."):empty("⚠️","Couldn't load",'<button class="btn ghost" id="retry">Try again</button>'));
    const r=$("#retry"); if(r) r.onclick=render; }
}

const VIEWS={
async profile(){
  const d=await api("/api/me"), s=d.stats, photo=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user||{}).photo_url||d.photo;
  const pct=d.top_percent?Math.max(6,100-d.top_percent):6;
  app.innerHTML=brand()+`<div class="card center">
    ${photo?`<img class="avatar" src="${esc(photo)}" alt="">`:av(d.name,d.uid,"avatar")}
    <div class="name">${esc(d.name)}</div><div class="sub">${d.username?"@"+esc(d.username):""}</div>
    ${d.played?`<div class="rankbox"><div class="hex"><small>OVERALL</small><div>#${fmt(d.ranks.overall)}</div></div>
      <div style="flex:1"><div class="tier">◆ ${d.tier}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="sub">Top ${d.top_percent}% of ${fmt(d.total_players)} players</div></div></div>
    <div class="grid"><div class="stat"><small>🏏 Runs</small><b>#${fmt(d.ranks.runs)}</b></div><div class="stat"><small>🎯 Wickets</small><b>${d.ranks.wickets?"#"+fmt(d.ranks.wickets):"–"}</b></div><div class="stat"><small>🏆 Wins</small><b>#${fmt(d.ranks.wins)}</b></div></div>`
    :`<div class="empty"><div class="ic">🏏</div><b>No matches yet</b>Play a match in the bot to get ranked.</div>`}
    <button class="btn" id="share">⇪ Share my rank</button></div>
    ${d.played?`<div class="grid">${[["Matches",s.matches],["Wins",s.wins],["Losses",s.losses],["Runs",s.runs],["Best score",s.highest],["Points",s.points]].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${fmt(b)}</b></div>`).join("")}</div>`:""}`;
  $("#share").onclick=()=>{const u=`https://t.me/share/url?url=${encodeURIComponent("https://t.me/"+(window.BOT||""))}&text=${encodeURIComponent(d.played?`I'm ranked #${d.ranks.overall} (${d.tier}) on Cricket League! 🏏 Can you beat me?`:"Play Cricket League with me! 🏏")}`; tg?tg.openTelegramLink(u):window.open(u)};
  api("/api/zone").then(z=>{window.BOT=z.bot_username}).catch(()=>{});
},
async ranks(){
  const d=await api("/api/ranks?metric="+state.metric), t=d.top, M={overall:"pts",runs:"runs",wickets:"wkts",wins:"wins"};
  const pod=[t[1],t[0],t[2]].map((p,i)=>p?`<div class="pod p${[2,1,3][i]}">${av(p.name,p.uid,"av")}<b style="font-size:14px">${esc(p.name)}</b><div class="blk"><b>${fmt(p.value)}</b><small style="color:var(--mut);display:block">${M[state.metric]}</small><i>${p.rank}</i></div></div>`:"<div></div>").join("");
  app.innerHTML=brand("Leaderboard")+`<div class="pills">${Object.keys(M).map(k=>`<button class="pill ${state.metric===k?"on":""}" data-m="${k}">${{overall:"👑 Overall",runs:"🏏 Runs",wickets:"🎯 Wickets",wins:"🏆 Wins"}[k]}</button>`).join("")}</div>
  <div class="sub" style="margin:-2px 0 8px">${fmt(d.total)} players · all-time ranking</div>
  ${t.length?`<div class="podium">${pod}</div>`:empty("🏆","No rankings yet","Play matches to appear here.")}
  ${d.me?`<div class="card" style="border-color:#7dd3fc"><small class="sub">YOUR RANK</small><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:10px;align-items:center">${av(d.me.name,d.me.uid)}<div><b>${esc(d.me.name)}</b><div class="sub">${fmt(d.me.points)} pts</div></div></div><div style="font-size:34px;font-weight:900;color:#7dd3fc">#${fmt(d.me.rank)}</div></div></div>`:""}
  ${t.length>3?`<h3>Top players</h3>`+t.slice(3).map(p=>`<div class="row ${p.me?"me":""}"><div class="n">${p.rank}</div>${av(p.name,p.uid)}<div class="t"><b>${esc(p.name)}</b><small>${p.username?"@"+esc(p.username):""}</small></div><div class="v">${fmt(p.value)}</div></div>`).join(""):""}`;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state.metric=b.dataset.m;haptic();render()});
},
async tours(){
  if(state.tour) return VIEWS.tour();
  const d=await api(`/api/tours?group=${state.group}&q=${encodeURIComponent(state.q)}`);
  if(!d.available){app.innerHTML=brand("Tournaments")+empty("🚩","Tournaments coming soon","Leagues and events will show up here.");return;}
  app.innerHTML=brand("Tournaments")+`<input id="q" class="pill" style="width:100%;margin-bottom:10px;background:var(--card);color:#fff" placeholder="🔍 Search tournaments" value="${esc(state.q)}">
  <div class="pills">${[["live","🔴 Live"],["upcoming","Upcoming"],["done","Done"]].map(([k,l])=>`<button class="pill ${state.group===k?"on":""}" data-g="${k}">${l}</button>`).join("")}</div>
  ${d.items.length?d.items.map(t=>`<div class="card tcard" data-id="${t.id}"><div><b style="font-size:18px">🏆 ${esc(t.name)}</b><div class="sub">👥 ${t.players}/${t.max}${t.fixtures_total?` · 📅 ${t.fixtures_done}/${t.fixtures_total} played`:""}</div>${t.champion?`<div class="sub">👑 ${esc(t.champion)}</div>`:t.start_at?`<div class="sub">Starts ${when(t.start_at)}</div>`:""}</div><span class="badge">${t.status.replace(/_/g," ")}</span></div>`).join(""):empty("🚩","Nothing here yet",`No ${state.group} tournaments right now.<br>Join them with /tournament in a group.`)}`;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{state.group=b.dataset.g;haptic();render()});
  app.querySelectorAll("[data-id]").forEach(c=>c.onclick=()=>{state.tour=c.dataset.id;haptic();render()});
  $("#q").onchange=e=>{state.q=e.target.value;render()};
},
async tour(){
  const d=await api("/api/tour?id="+state.tour);
  app.innerHTML=brand("Tournament")+`<button class="pill" id="back">← Back</button><h2 style="margin-top:12px">🏆 ${esc(d.name)}</h2>
  <div class="card scroll"><table><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Pts</th></tr>${d.table.map(r=>`<tr><td>${r.pos}</td><td>${esc(r.name)}${r.withdrawn?" *":""}</td><td>${r.played}</td><td>${r.won}</td><td>${r.lost}</td><td>${r.tied}</td><td><b>${r.points}</b></td></tr>`).join("")}</table></div>
  ${d.fixtures.length?`<h3>Fixtures</h3><div class="card">${d.fixtures.map(f=>`<div class="fx"><b>#${f.no}</b> ${esc(f.p1)} ${f.r1!=null?`<b>${f.r1}–${f.r2}</b>`:"vs"} ${esc(f.p2)}<small>${f.status==="COMPLETED"?(f.winner?esc(f.winner)+" won":"Tie"):f.status==="FORFEIT"?"Walkover: "+esc(f.winner||""):f.status==="OPEN"?"🟢 Open — check in via the bot":f.status.replace(/_/g," ").toLowerCase()+" · "+when(f.scheduled_at)}</small></div>`).join("")}</div>`:""}
  <div class="sub center">Join and check in via /tournament in the group.</div>`;
  $("#back").onclick=()=>{state.tour=null;render()};
},
async trophies(){
  const d=await api("/api/trophies"), cats=["All",...new Set(d.trophies.map(t=>t.category))];
  const list=d.trophies.filter(t=>state.cat==="All"||t.category===state.cat), pct=Math.round(d.unlocked/d.total*100);
  const card=t=>`<div class="tro ${t.unlocked?"":"lock"} ${t.tier}"><div class="m">${t.unlocked?"★":"🔒"}</div><b>${esc(t.name)}</b><small>${t.unlocked?"Unlocked":fmt(t.progress)+" / "+fmt(t.target)}</small></div>`;
  app.innerHTML=brand("Trophies")+`<div class="card summ"><div class="ring" style="--p:${pct}"><span>${pct}%</span></div><div><div style="font-size:26px;font-weight:800">${d.unlocked} / ${d.total} Trophies</div><div class="sub">🥇 ${d.medals.gold} &nbsp; 🥈 ${d.medals.silver} &nbsp; 🥉 ${d.medals.bronze}</div></div></div>
  ${d.almost.length?`<h3>Almost there</h3>${d.almost.map(t=>`<div class="row"><div class="tro lock ${t.tier}" style="border:0;background:none;padding:0"><div class="m" style="width:44px;height:44px;margin:0;font-size:18px">🔒</div></div><div class="t"><b>${esc(t.name)}</b><small>${esc(t.desc)}</small><div class="bar"><i style="width:${t.progress/t.target*100}%;background:var(--acc2)"></i></div></div><div class="v">${Math.round(t.progress/t.target*100)}%</div></div>`).join("")}`:""}
  ${d.leagues.length||d.awards.length?`<h3>Awards</h3><div class="card">${d.leagues.map(l=>`<div class="fx">👑 Champion — ${esc(l.name)}</div>`).join("")}${d.awards.map(a=>`<div class="fx">🏅 ${esc(a)}</div>`).join("")}</div>`:""}
  <h3>All trophies</h3><div class="pills">${cats.map(c=>`<button class="pill ${state.cat===c?"on":""}" data-c="${c}">${c}</button>`).join("")}</div><div class="tgrid">${list.map(card).join("")}</div>`;
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;haptic();render()});
},
async zone(){
  const z=await api("/api/zone"), link=z.bot_username?"https://t.me/"+z.bot_username:"";
  app.innerHTML=brand()+`<div class="card center"><div class="avatar" style="background:linear-gradient(135deg,#ff9d42,#22c55e);font-size:44px">🏏</div><div class="name" style="font-size:30px;-webkit-text-fill-color:#fff">The Cricket Zone</div>
  <div style="color:var(--acc);margin:6px 0">Play. Destroy. Dominate.</div><div class="sub">Join the community for updates, events and everyone who plays.</div>
  ${z.community_url?`<button class="btn" id="join">➤ Join ${esc(z.community_name)}</button>`:""}</div>
  ${link?`<div class="row" id="open"><div class="mini" style="background:#22c55e">🏏</div><div class="t"><b>Open Cricket League</b><small>@${esc(z.bot_username)}</small></div>›</div>
  <div class="row" id="inv"><div class="mini" style="background:#84cc16">⇪</div><div class="t"><b>Invite friends</b><small>Share the bot in any chat</small></div>›</div>`:""}`;
  const go=u=>tg?tg.openTelegramLink(u):window.open(u);
  if($("#join")) $("#join").onclick=()=>go(z.community_url);
  if($("#open")) $("#open").onclick=()=>go(link);
  if($("#inv")) $("#inv").onclick=()=>go(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent("Play Cricket League with me! 🏏")}`);
}};
render();
</script>
</body>
</html>
