<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UltimateCric</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#05050f;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.085);--line:rgba(255,255,255,.09);
  --txt:#f5f6fb;--mut:#8f92b3;--acc:#ffb347;--acc2:#ff5e7e;--cy:#5ad1ff;--gr:#4ade80;
  --gold:#f7c948;--silver:#cdd3ee;--bronze:#e39a6b;
  --r:24px;--font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-top:env(safe-area-inset-top);
  background:
   radial-gradient(520px 360px at 8% -6%,var(--h1,rgba(139,92,246,.42)),transparent 70%),
   radial-gradient(480px 340px at 108% 4%,var(--h2,rgba(34,211,238,.26)),transparent 70%),
   radial-gradient(600px 400px at 50% 112%,var(--h3,rgba(255,94,126,.16)),transparent 70%),var(--bg);
  background-attachment:fixed;transition:background .5s}
body[data-tab=ranks]{--h1:rgba(245,158,11,.40);--h2:rgba(190,18,60,.26)}
body[data-tab=tours]{--h1:rgba(99,102,241,.44);--h2:rgba(168,85,247,.28)}
body[data-tab=trophies]{--h1:rgba(16,185,129,.40);--h2:rgba(14,165,233,.26)}
body[data-tab=zone]{--h1:rgba(251,146,60,.42);--h2:rgba(34,197,94,.28)}
#app{padding:16px 16px calc(112px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.view{animation:in .38s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ic{display:inline-block;vertical-align:middle;flex:none}

/* brand */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.brand b{display:block;font-size:14px;font-weight:800;letter-spacing:.26em}
.brand small{display:flex;align-items:center;gap:6px;color:var(--acc);font-size:12px;font-weight:600;margin-top:3px}
.brand small i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

/* surfaces */
.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px -22px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07)}
.center{text-align:center}.sub{color:var(--mut);font-size:13.5px}.tiny{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;text-transform:uppercase}
h3{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:.02em;margin:22px 2px 12px}
h3::before{content:"";width:3px;height:16px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc2))}
.grad{background:linear-gradient(92deg,#fff,#c9b8ff 55%,#8fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}

/* avatars */
.ph{position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;border-radius:50%;flex:none;background:var(--c,#6366f1)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ring{padding:3px;border-radius:50%;background:conic-gradient(from 200deg,var(--cy),#a78bfa,var(--acc2),var(--acc),var(--cy));display:inline-block;box-shadow:0 0 34px -4px rgba(120,160,255,.5)}
.ring .ph{border:3px solid var(--bg)}
.big{width:104px;height:104px;font-size:34px}.m{width:42px;height:42px;font-size:14px}.s{width:36px;height:36px;font-size:13px}

/* profile */
.tier{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 10px;border-radius:999px;font-weight:800;font-size:14px;color:var(--t);background:color-mix(in srgb,var(--t) 14%,transparent);border:1px solid color-mix(in srgb,var(--t) 38%,transparent)}
.rank{margin-top:18px;padding:18px;border-radius:20px;background:linear-gradient(160deg,rgba(0,0,0,.28),rgba(255,255,255,.03));border:1px solid var(--line)}
.rank .num{font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1;background:linear-gradient(180deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--cy),#a78bfa)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:14px 8px;text-align:center}
.tile .ic{color:var(--acc);margin-bottom:6px}.tile small{display:block;color:var(--mut);font-size:12px}.tile b{display:block;font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;padding:16px;font:700 16px var(--font);color:#1a1020;background:linear-gradient(95deg,var(--acc),#ffd9a0 48%,var(--gr));margin-top:16px;box-shadow:0 14px 30px -12px rgba(255,179,71,.55);transition:transform .15s}
.btn:active,.row:active,.pill:active,.tcard:active{transform:scale(.97)}

/* pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:10px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font:600 14px var(--font);transition:.2s}
.pill.on{color:#1b1220;background:linear-gradient(95deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 10px 22px -10px rgba(255,94,126,.7)}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:10px;align-items:end;margin:10px 0 18px}
.pod{text-align:center;--c:var(--silver)}.pod.p1{--c:var(--gold)}.pod.p3{--c:var(--bronze)}
.pod .top{position:relative;display:inline-block;margin-bottom:8px}
.pod .crown{position:absolute;left:50%;top:-22px;transform:translateX(-50%);color:var(--gold);filter:drop-shadow(0 4px 10px rgba(247,201,72,.6))}
.pod .av{padding:3px;border-radius:50%;background:linear-gradient(160deg,var(--c),transparent 130%);box-shadow:0 0 30px -6px var(--c)}
.pod .av .ph{border:3px solid var(--bg)}
.pod .badge{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:#1b1220;background:var(--c);border:2px solid var(--bg)}
.pod .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.pod .blk{margin-top:8px;border-radius:18px 18px 4px 4px;padding:12px 4px 10px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,transparent),rgba(255,255,255,.02));position:relative;overflow:hidden;height:var(--h)}
.pod.p1{--h:132px}.pod.p2{--h:104px}.pod.p3{--h:88px}
.pod .blk b{display:block;font-size:22px;font-weight:900;color:var(--c);letter-spacing:-.02em}.pod .blk small{color:var(--mut);font-size:11px}
.pod .blk i{position:absolute;left:0;right:0;bottom:-14px;font-style:normal;font-size:72px;font-weight:900;color:var(--c);opacity:.14;line-height:1}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:18px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);transition:transform .15s}
.row.me{border-color:rgba(90,209,255,.55);background:linear-gradient(90deg,rgba(90,209,255,.14),var(--panel))}
.row .n{width:30px;text-align:center;font-weight:800;color:var(--mut);font-size:15px}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{color:var(--mut);font-size:12.5px}
.row .v{font-weight:800;font-size:17px;text-align:right}.row .v small{display:block;color:var(--mut);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.you{font-size:10px;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:6px;background:var(--cy);color:#04141c;margin-left:6px;vertical-align:2px}
.chev{color:var(--mut)}

/* trophies */
.sumcard{display:flex;gap:18px;align-items:center}
.dial{--p:0;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(255,255,255,.1) 0);flex:none}
.dial span{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:#0b0d1b;font-size:22px;font-weight:900}
.meds{display:flex;gap:14px;margin-top:10px}.meds span{display:flex;align-items:center;gap:6px;font-weight:700}.dot{width:12px;height:12px;border-radius:50%;background:var(--mc)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tro{text-align:center;padding:14px 6px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.medal{position:relative;width:64px;height:64px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:#3a2412;background:radial-gradient(circle at 30% 25%,#fff8,transparent 45%),var(--mc);box-shadow:0 8px 20px -8px var(--mg),inset 0 -5px 10px rgba(0,0,0,.22),inset 0 0 0 3px rgba(255,255,255,.18)}
.tro.lock .medal{background:#232638;color:#6b6f8c;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.tro b{font-size:13px;font-weight:700;display:block;line-height:1.2}.tro small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.bronze{--mc:linear-gradient(145deg,#f6c3a0,#c47a4b);--mg:rgba(227,154,107,.7)}.silver{--mc:linear-gradient(145deg,#f4f6ff,#9aa4cc);--mg:rgba(205,211,238,.6)}.gold{--mc:linear-gradient(145deg,#ffe38f,#e0a42a);--mg:rgba(247,201,72,.7)}
.prog{margin-top:8px}.prog .bar i{background:linear-gradient(90deg,var(--gr),#a3e635)}

/* tournaments */
.search{display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px;color:var(--mut)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:500 15px var(--font);padding:14px 0}
.tcard{display:flex;gap:14px;align-items:center;margin-bottom:12px;cursor:pointer;transition:transform .15s}.tcard .ti{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--gold);background:rgba(247,201,72,.12);border:1px solid rgba(247,201,72,.3);flex:none}
.tcard h4{font-size:17px;font-weight:800;margin-bottom:5px}.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13px}.meta span{display:inline-flex;align-items:center;gap:5px}
.chip{font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);text-transform:uppercase;white-space:nowrap}
.chip.live{background:rgba(239,68,68,.16);color:#ff8a8a}.chip.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff5a5a;margin-right:6px;animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.25}}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{color:var(--mut);font-weight:700;font-size:11px;letter-spacing:.08em;text-align:right;padding:6px 4px}td{padding:10px 4px;text-align:right;border-top:1px solid var(--line)}th:nth-child(2),td:nth-child(2){text-align:left}.scroll{overflow-x:auto}
.fx{padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}.fx:first-child{border-top:0}.fx small{color:var(--mut);display:block;margin-top:3px;font-size:12.5px}

/* misc */
.empty{text-align:center;color:var(--mut);padding:56px 12px}.empty .ei{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--acc)}.empty b{display:block;color:var(--txt);font-size:19px;margin-bottom:5px}
.back{margin-bottom:10px}
.sk{border-radius:20px;background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 70%);background-size:300% 100%;animation:sh 1.3s infinite;margin-bottom:12px}@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}

/* nav */
.nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;display:flex;padding:7px;border-radius:30px;background:rgba(16,16,38,.82);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 20px 40px -12px rgba(0,0,0,.8);z-index:10}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 2px 8px;border-radius:24px;font:600 11.5px var(--font);display:flex;flex-direction:column;align-items:center;gap:4px;transition:.25s}
.nav button.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.nav button.on .ic{color:var(--acc);filter:drop-shadow(0 0 8px rgba(255,179,71,.6))}
</style>
</head>
<body data-tab="profile">
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{tg.setHeaderColor('#05050f');tg.setBackgroundColor('#05050f');}catch(e){} }

/* ---------- icons (inline SVG, no emoji) ---------- */
const P={
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/>',
 award:'<circle cx="12" cy="9" r="6"/><path d="m8.6 14.2-1.6 7.3 5-2.8 5 2.8-1.6-7.3"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.6 3.2 14.4 0 18M12 3c-3.2 3.6-3.2 14.4 0 18"/>',
 send:'<path d="M21.5 2.5 10.5 13.5M21.5 2.5l-7 19-4-8.5-8.5-4z"/>',
 crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',
 bat:'<path d="m14.5 4.5 5 5-9.2 9.2a2 2 0 0 1-1.4.6H6.5v-2.4c0-.5.2-1 .6-1.4z"/><path d="M5 19 3 21"/>',
 stumps:'<path d="M7 5v15M12 5v15M17 5v15"/><path d="M6 5h5M13 5h5" />',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 share:'<path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
 chev:'<path d="m9 6 6 6-6 6"/>',
 back:'<path d="m15 6-6 6 6 6"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.4 2.8-5.5 6.5-5.5s6.5 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20c0-2.5-1.6-4.3-3.8-5.1"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 diamond:'<path d="m12 2 8 8-8 12L4 10z"/><path d="M4 10h16"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>'
};
const ic=(n,s=20,x="")=>`<svg class="ic ${x}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]||""}</svg>`;
const BALL=(s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48"><defs><radialGradient id="bg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ff8a7a"/><stop offset=".6" stop-color="#d7263d"/><stop offset="1" stop-color="#8f1427"/></radialGradient></defs><circle cx="24" cy="24" r="21" fill="url(#bg)"/><path d="M9 11c8 5 8 21 0 26M39 11c-8 5-8 21 0 26" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="2.4 2.6" stroke-linecap="round" opacity=".9"/></svg>`;

const TABS=[["profile","user","Profile"],["ranks","trophy","Ranks"],["tours","flag","Tours"],["trophies","award","Trophies"],["zone","globe","Zone"]];
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("en-IN");
let NAME="UltimateCric";
const state={tab:"profile",metric:"overall",group:"live",q:"",cat:"All",tour:null};
const COLORS=["#f97316","#8b5cf6","#06b6d4","#ec4899","#22c55e","#eab308","#ef4444","#3b82f6"];
const ini=n=>(String(n).trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2)||"?").toUpperCase();
const col=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
/* avatar: initials underneath, real Telegram photo on top (removed again if it fails to load) */
const av=(n,id,size="m",sig,photo)=>{const src=photo||(sig?`/avatar/${id}?s=${sig}`:"");
  return `<div class="ph ${size}" style="--c:${col(id??n)}"><span>${esc(ini(n))}</span>${src?`<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>`};
const when=t=>t?new Date(t*1000).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+" IST":"time TBD";
const haptic=()=>{try{tg.HapticFeedback.selectionChanged()}catch(e){}};
const TIER={Legend:"#fbbf24",Elite:"#c084fc",Pro:"#38bdf8",Regular:"#4ade80",Rookie:"#94a3b8"};

async function api(path){
  const r=await fetch(path,{headers:{Authorization:"tma "+(tg?tg.initData:"")}});
  if(r.status===401) throw new Error("open");
  if(!r.ok) throw new Error("fail");
  return r.json();
}
const brand=sub=>`<div class="brand"><div class="logo">${BALL(28)}</div><div><b>${esc(NAME.toUpperCase())}</b><small><i></i>${sub||"MiniApp"}</small></div></div>`;
const empty=(i,t,s)=>`<div class="empty"><div class="ei">${ic(i,34)}</div><b>${t}</b>${s||""}</div>`;
const skeleton=()=>`<div class="sk" style="height:56px;width:60%"></div><div class="sk" style="height:300px"></div><div class="sk" style="height:90px"></div><div class="sk" style="height:90px"></div>`;
const view=h=>{app.innerHTML=`<div class="view">${h}</div>`};

function nav(){ $("#nav").innerHTML=TABS.map(([k,i,l])=>`<button class="${state.tab===k?"on":""}" data-t="${k}">${ic(i,22)}${l}</button>`).join("");
  document.body.dataset.tab=state.tab;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;state.tour=null;haptic();render();window.scrollTo(0,0)}); }

async function render(){
  nav(); app.innerHTML=skeleton();
  try{ await VIEWS[state.tab](); }
  catch(e){ view(brand()+(e.message==="open"?empty("send","Open from Telegram","This app works inside the bot's chat."):empty("spark","Couldn't load",'<button class="btn" id="retry" style="max-width:200px;margin:14px auto 0">Try again</button>')));
    const r=$("#retry"); if(r) r.onclick=render; }
}

const VIEWS={
async profile(){
  const d=await api("/api/me"), s=d.stats, photo=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user||{}).photo_url||d.photo;
  const pct=d.top_percent?Math.max(6,100-d.top_percent):6, tc=TIER[d.tier]||TIER.Rookie;
  view(brand()+`<div class="card center">
    <div class="ring">${av(d.name,d.uid,"big",null,photo)}</div>
    <div class="grad" style="font-size:30px;font-weight:900;letter-spacing:-.02em;margin-top:12px">${esc(d.name)}</div><div class="sub" style="margin:2px 0 12px">${d.username?"@"+esc(d.username):"&nbsp;"}</div>
    ${d.played?`<span class="tier" style="--t:${tc}">${ic("diamond",16)}${d.tier}</span>
    <div class="rank"><div class="tiny">Overall rank</div><div class="num">#${fmt(d.ranks.overall)}</div>
      <div class="bar" style="margin:12px 0 8px"><i style="width:${pct}%"></i></div><div class="sub">Top ${d.top_percent}% of ${fmt(d.total_players)} players</div></div>`
    :empty("bat","No matches yet","Play a match in the bot to get ranked.")}
    <button class="btn" id="share">${ic("share",20)}Share my rank</button></div>
  ${d.played?`<div class="tiles">${[["bat","Runs",d.ranks.runs],["stumps","Wickets",d.ranks.wickets],["trophy","Wins",d.ranks.wins]].map(([i,l,v])=>`<div class="tile">${ic(i,24)}<small>${l} rank</small><b>${v?"#"+fmt(v):"–"}</b></div>`).join("")}</div>
  <h3>Career</h3><div class="tiles">${[["Matches",s.matches],["Wins",s.wins],["Losses",s.losses],["Runs",s.runs],["Best score",s.highest],["Points",s.points]].map(([a,b])=>`<div class="tile"><small>${a}</small><b>${fmt(b)}</b></div>`).join("")}</div>`:""}`);
  $("#share").onclick=()=>{const u=`https://t.me/share/url?url=${encodeURIComponent("https://t.me/"+(window.BOT||""))}&text=${encodeURIComponent(d.played?`I'm ranked #${d.ranks.overall} (${d.tier}) on ${NAME}! Can you beat me?`:`Play ${NAME} with me!`)}`; tg?tg.openTelegramLink(u):window.open(u)};
  api("/api/zone").then(z=>{window.BOT=z.bot_username}).catch(()=>{});
},
async ranks(){
  const d=await api("/api/ranks?metric="+state.metric), t=d.top, U={overall:"pts",runs:"runs",wickets:"wkts",wins:"wins"};
  const PM={overall:["Overall","crown"],runs:["Runs","bat"],wickets:["Wickets","stumps"],wins:["Wins","trophy"]};
  const pod=[[t[1],2],[t[0],1],[t[2],3]].map(([p,k])=>p?`<div class="pod p${k}"><div class="top">${k===1?`<span class="crown">${ic("crown",26)}</span>`:""}<div class="av">${av(p.name,p.uid,k===1?"big":"m",p.sig)}</div><div class="badge">${k}</div></div><div class="nm">${esc(p.name)}</div><div class="blk"><b>${fmt(p.value)}</b><small>${U[state.metric]}</small><i>${k}</i></div></div>`:"<div></div>").join("");
  view(brand("Leaderboard")+`<div class="pills">${Object.keys(PM).map(k=>`<button class="pill ${state.metric===k?"on":""}" data-m="${k}">${ic(PM[k][1],17)}${PM[k][0]}</button>`).join("")}</div>
  <div class="sub" style="margin:0 2px 6px">${fmt(d.total)} players &middot; all-time ranking</div>
  ${t.length?`<div class="podium">${pod}</div>`:empty("trophy","No rankings yet","Play matches to appear here.")}
  ${d.me?`<div class="card" style="border-color:rgba(90,209,255,.5);padding:16px"><div class="tiny">Your rank</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div style="display:flex;gap:12px;align-items:center">${av(d.me.name,d.me.uid,"m",d.me.sig)}<div><b>${esc(d.me.name)}</b><div class="sub">${fmt(d.me.points)} pts</div></div></div><div style="font-size:38px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(180deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent">#${fmt(d.me.rank)}</div></div></div>`:""}
  ${t.length>3?`<h3>Top players</h3>`+t.slice(3).map(p=>`<div class="row ${p.me?"me":""}"><div class="n">${p.rank}</div>${av(p.name,p.uid,"m",p.sig)}<div class="t"><b>${esc(p.name)}${p.me?'<span class="you">YOU</span>':""}</b><small>${p.username?"@"+esc(p.username):"&nbsp;"}</small></div><div class="v">${fmt(p.value)}<small>${U[state.metric]}</small></div></div>`).join(""):""}`);
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{state.metric=b.dataset.m;haptic();render()});
},
async tours(){
  if(state.tour) return VIEWS.tour();
  const d=await api(`/api/tours?group=${state.group}&q=${encodeURIComponent(state.q)}`);
  if(!d.available){view(brand("Tournaments")+empty("flag","Tournaments coming soon","Leagues and events will show up here."));return;}
  view(brand("Tournaments")+`<div class="search">${ic("search",18)}<input id="q" placeholder="Search tournaments" value="${esc(state.q)}"></div>
  <div class="pills">${[["live","Live"],["upcoming","Upcoming"],["done","Done"]].map(([k,l])=>`<button class="pill ${state.group===k?"on":""}" data-g="${k}">${l}</button>`).join("")}</div>
  ${d.items.length?d.items.map(t=>`<div class="card tcard" data-id="${t.id}"><div class="ti">${ic("trophy",24)}</div><div style="flex:1;min-width:0"><h4>${esc(t.name)}</h4><div class="meta"><span>${ic("users",15)}${t.players}/${t.max}</span>${t.fixtures_total?`<span>${ic("cal",15)}${t.fixtures_done}/${t.fixtures_total} played</span>`:""}${t.champion?`<span>${ic("crown",15)}${esc(t.champion)}</span>`:t.start_at?`<span>${ic("clock",15)}${when(t.start_at)}</span>`:""}</div></div><span class="chip ${t.status==="IN_PROGRESS"?"live":""}">${t.status==="IN_PROGRESS"?"Live":t.status.replace(/_/g," ").toLowerCase()}</span></div>`).join(""):empty("flag","Nothing here yet",`No ${state.group} tournaments right now.`)}`);
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{state.group=b.dataset.g;haptic();render()});
  app.querySelectorAll("[data-id]").forEach(c=>c.onclick=()=>{state.tour=c.dataset.id;haptic();render()});
  $("#q").onchange=e=>{state.q=e.target.value;render()};
},
async tour(){
  const d=await api("/api/tour?id="+state.tour);
  view(brand("Tournament")+`<button class="pill back" id="back">${ic("back",16)}Back</button><div class="grad" style="font-size:26px;font-weight:900;margin:6px 2px 14px;letter-spacing:-.02em">${esc(d.name)}</div>
  <div class="card scroll" style="padding:12px 14px"><table><tr><th>#</th><th>PLAYER</th><th>P</th><th>W</th><th>L</th><th>T</th><th>PTS</th></tr>${d.table.map(r=>`<tr><td>${r.pos}</td><td>${esc(r.name)}${r.withdrawn?" *":""}</td><td>${r.played}</td><td>${r.won}</td><td>${r.lost}</td><td>${r.tied}</td><td><b>${r.points}</b></td></tr>`).join("")}</table></div>
  ${d.fixtures.length?`<h3>Fixtures</h3><div class="card" style="padding:8px 18px">${d.fixtures.map(f=>`<div class="fx"><b>#${f.no}</b> &nbsp;${esc(f.p1)} ${f.r1!=null?`<b>${f.r1} – ${f.r2}</b>`:'<span class="sub">vs</span>'} ${esc(f.p2)}<small>${f.status==="COMPLETED"?(f.winner?esc(f.winner)+" won":"Tie"):f.status==="FORFEIT"?"Walkover: "+esc(f.winner||""):f.status==="OPEN"?"Open - check in via the bot":f.status.replace(/_/g," ").toLowerCase()+" · "+when(f.scheduled_at)}</small></div>`).join("")}</div>`:""}`);
  $("#back").onclick=()=>{state.tour=null;render()};
},
async trophies(){
  const d=await api("/api/trophies"), cats=["All",...new Set(d.trophies.map(t=>t.category))];
  const list=d.trophies.filter(t=>state.cat==="All"||t.category===state.cat), pct=Math.round(d.unlocked/d.total*100);
  const card=t=>`<div class="tro ${t.unlocked?"":"lock"} ${t.tier}"><div class="medal">${ic(t.unlocked?"star":"lock",t.unlocked?28:24)}</div><b>${esc(t.name)}</b><small>${t.unlocked?"Unlocked":fmt(t.progress)+" / "+fmt(t.target)}</small></div>`;
  view(brand("Trophies")+`<div class="card sumcard"><div class="dial" style="--p:${pct}"><span>${pct}%</span></div><div><div style="font-size:25px;font-weight:900;letter-spacing:-.02em">${d.unlocked} / ${d.total}</div><div class="sub">Trophies unlocked</div>
   <div class="meds"><span><i class="dot" style="--mc:var(--gold)"></i>${d.medals.gold}</span><span><i class="dot" style="--mc:var(--silver)"></i>${d.medals.silver}</span><span><i class="dot" style="--mc:var(--bronze)"></i>${d.medals.bronze}</span></div></div></div>
  ${d.almost.length?`<h3>Almost there</h3>${d.almost.map(t=>`<div class="row"><div class="tro lock ${t.tier}" style="border:0;background:none;padding:0"><div class="medal" style="width:46px;height:46px;margin:0">${ic("lock",18)}</div></div><div class="t"><b>${esc(t.name)}</b><small>${esc(t.desc)}</small><div class="bar prog"><i style="width:${t.progress/t.target*100}%"></i></div></div><div class="v">${Math.round(t.progress/t.target*100)}%</div></div>`).join("")}`:""}
  ${d.leagues.length||d.awards.length?`<h3>Awards</h3><div class="card" style="padding:6px 18px">${d.leagues.map(l=>`<div class="fx" style="display:flex;gap:10px;align-items:center">${ic("crown",18)}League champion &middot; ${esc(l.name)}</div>`).join("")}${d.awards.map(a=>`<div class="fx" style="display:flex;gap:10px;align-items:center">${ic("award",18)}${esc(a)}</div>`).join("")}</div>`:""}
  <h3>All trophies</h3><div class="pills">${cats.map(c=>`<button class="pill ${state.cat===c?"on":""}" data-c="${c}">${c}</button>`).join("")}</div><div class="tgrid">${list.map(card).join("")}</div>`);
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;haptic();render()});
},
async zone(){
  const z=await api("/api/zone"), link=z.bot_username?"https://t.me/"+z.bot_username:"";
  view(brand()+`<div class="card center" style="padding:26px 20px"><div class="ring"><div class="ph big" style="background:linear-gradient(145deg,#ff9d42,#22c55e)">${BALL(58)}</div></div>
  <div class="grad" style="font-size:30px;font-weight:900;letter-spacing:-.02em;margin-top:14px">The ${esc(NAME)} Zone</div>
  <div style="color:var(--acc);font-weight:700;margin:6px 0 10px">Play. Destroy. Dominate.</div><div class="sub">Join the community for updates, events and everyone who plays.</div>
  ${z.community_url?`<button class="btn" id="join">${ic("send",20)}Join ${esc(z.community_name)}</button>`:""}</div>
  ${link?`<div class="row" id="open" style="padding:14px"><div class="ph m" style="background:linear-gradient(145deg,#22c55e,#15803d)">${ic("bat",22)}</div><div class="t"><b>Open ${esc(NAME)}</b><small>@${esc(z.bot_username)}</small></div><span class="chev">${ic("chev",20)}</span></div>
  <div class="row" id="inv" style="padding:14px"><div class="ph m" style="background:linear-gradient(145deg,#a3e635,#4d7c0f)">${ic("share",20)}</div><div class="t"><b>Invite friends</b><small>Share the bot in any chat</small></div><span class="chev">${ic("chev",20)}</span></div>`:""}`);
  const go=u=>tg?tg.openTelegramLink(u):window.open(u);
  if($("#join")) $("#join").onclick=()=>go(z.community_url);
  if($("#open")) $("#open").onclick=()=>go(link);
  if($("#inv")) $("#inv").onclick=()=>go(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent("Play "+NAME+" with me!")}`);
}};
api("/api/zone").then(z=>{if(z.app_name){NAME=z.app_name;document.title=NAME}}).catch(()=>{}).finally(render);
</script>
</body>
</html>
